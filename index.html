<!DOCTYPE html>
<html lang="fi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Ovipiirrin: käyntioven naamakuva ja speksipalsta SVG:nä.">
    <title>Ovipiirrin</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="styles.css?v=7">
</head>
<body>
    <a href="#drawerScreen" class="skip-link">Siirry sisältöön</a>

    <div id="drawerScreen" class="container py-4">
        <div class="card shadow-lg mb-4">
            <div class="card-body p-3">
                <div class="app-header-row">
                    <div class="app-header-left">
                        <span class="app-title">Ovipiirrin</span>
                    </div>
                    <div class="app-header-center">
                        <span class="badge text-bg-secondary">testiversio</span>
                    </div>
                    <div class="app-header-right">
        <span class="header-hint">SVG · Janisol 2</span>
                    </div>
                </div>
            </div>
        </div>

        <div class="card shadow-lg mb-4">
            <div class="card-body p-4">
                <div class="d-flex justify-content-between align-items-center mb-4">
                    <h4 class="mb-0">Syötteet</h4>
                </div>

                <div class="row g-4 drawer-inputs-row">
                    <div class="col-md-6 drawer-input-col">
                        <div class="row g-3">
                            <div class="col-4">
                                <label class="form-label" for="leveysInput">Leveys mm</label>
                                <input class="form-control" id="leveysInput" type="number" min="500" max="3000" step="1">
                            </div>
                            <div class="col-4">
                                <label class="form-label" for="korkeusInput">Korkeus mm</label>
                                <input class="form-control" id="korkeusInput" type="number" min="800" max="3000" step="1">
                            </div>
                            <div class="col-4">
                                <label class="form-label" for="ovityyppiInput">Ovityyppi</label>
                                <select class="form-select" id="ovityyppiInput">
                                    <option value="kayntiovi">Käyntiovi</option>
                                    <option value="pariovi">Pariovi</option>
                                </select>
                            </div>
                            <div class="col-4">
                                <label class="form-label" for="valoLeveysInput">Valoaukko leveys mm</label>
                                <input class="form-control" id="valoLeveysInput" type="number" min="80" max="2500" step="1">
                            </div>
                            <div class="col-4">
                                <label class="form-label" for="valoKorkeusInput">Valoaukko korkeus mm</label>
                                <input class="form-control" id="valoKorkeusInput" type="number" min="80" max="2800" step="1">
                            </div>
                            <div class="col-4" id="lisaValoCol" style="display:none;">
                                <label class="form-label" for="lisaValoInput">Lisäovi valoaukko mm</label>
                                <input class="form-control" id="lisaValoInput" type="number" min="80" max="2000" step="1">
                            </div>
                            <div class="col-6">
                                <label class="form-label" for="saranapuoliInput">Kätisyys</label>
                                <select class="form-select" id="saranapuoliInput">
                                    <option value="oikea">Oikea</option>
                                    <option value="vasen">Vasen</option>
                                </select>
                            </div>
                            <div class="col-6">
                                <label class="form-label" for="katseluInput">Katselu</label>
                                <select class="form-select" id="katseluInput">
                                    <option value="ulkoa">Ulkoa katsottuna</option>
                                </select>
                            </div>
                            <div class="col-6">
                                <label class="form-label" for="potkulevyInput">Potkulevy mm</label>
                                <input class="form-control" id="potkulevyInput" type="number" min="0" step="1">
                            </div>
                            <div class="col-6">
                                <label class="form-label" for="lukkoInput">Lukkokorkeus mm</label>
                                <input class="form-control" id="lukkoInput" type="number" min="1" step="1">
                            </div>
                            <div class="col-12">
                                <div class="form-check drawer-check">
                                    <input class="form-check-input" type="checkbox" id="lasiInput" checked>
                                    <label class="form-check-label" for="lasiInput">Lasiaukko</label>
                                </div>
                            </div>
                            <div class="col-6">
                                <label class="form-label" for="lasiPaksuusInput">Lasi mm</label>
                                <input class="form-control" id="lasiPaksuusInput" type="number" min="0" step="1">
                            </div>
                        </div>
                    </div>

                    <div class="col-md-6 drawer-input-col">
                        <div class="row g-3">
                            <div class="col-12">
                                <label class="form-label" for="tyyppiInput">Tyyppi</label>
                                <input class="form-control" id="tyyppiInput" type="text" spellcheck="false">
                            </div>
                            <div class="col-6">
                                <label class="form-label" for="maaraInput">Määrä</label>
                                <input class="form-control" id="maaraInput" type="number" min="1" step="1">
                            </div>
                            <div class="col-6">
                                <label class="form-label" for="variInput">Väri</label>
                                <input class="form-control" id="variInput" type="text" spellcheck="false">
                            </div>
                            <div class="col-6">
                                <label class="form-label" for="tyoInput">Työ</label>
                                <input class="form-control" id="tyoInput" type="text" spellcheck="false">
                            </div>
                            <div class="col-6">
                                <label class="form-label" for="tyonumeroInput">Työnumero</label>
                                <input class="form-control" id="tyonumeroInput" type="text" spellcheck="false">
                            </div>
                            <div class="col-6">
                                <label class="form-label" for="jarjestelmaInput">Järjestelmä</label>
                                <input class="form-control" id="jarjestelmaInput" type="text" spellcheck="false">
                            </div>
                            <div class="col-6">
                                <label class="form-label" for="kynnysInput">Kynnys</label>
                                <input class="form-control" id="kynnysInput" type="text" spellcheck="false">
                            </div>
                            <div class="col-12">
                                <label class="form-label" for="lisatInput">Lisätiedot</label>
                                <textarea class="form-control textarea-tall" id="lisatInput" rows="8" spellcheck="false" placeholder="Yksi rivi per tieto"></textarea>
                            </div>
                        </div>
                    </div>
                </div>

                <div id="drawerError" class="alert alert-warning mt-3 mb-0" style="display:none;"></div>

                <div class="mt-3 d-flex justify-content-end gap-2 flex-wrap">
                    <button type="button" class="btn btn-outline-secondary" id="back3dBtn">Palaa 3D-piirtimeen</button>
                    <button type="button" class="btn btn-outline-secondary" id="clearBtn">Tyhjennä</button>
                    <button type="button" class="btn btn-outline-secondary" id="exampleBtn">Lataa esimerkki</button>
                    <button type="button" class="btn btn-primary" id="downloadBtn">Lataa SVG</button>
                </div>
            </div>
        </div>

        <div id="previewCard" class="card shadow-lg mb-4">
            <div class="card-body p-4">
                <div class="d-flex justify-content-between align-items-center mb-3 flex-wrap gap-2">
                    <h4 class="mb-0">Esikatselu</h4>
                    <span id="previewStatus" class="preview-status"></span>
                </div>
                <div class="preview-toolbar">
                    <span class="header-hint">A3 vaaka · 1:10 · Janisol 2 · Logikal-viivat</span>
                </div>
                <div id="previewHost" class="preview-host" aria-label="Oven naamakuva"></div>
                <div class="preview-actions">
                    <button type="button" class="btn btn-sm btn-outline-secondary" id="copyJsonBtn">Kopioi JSON</button>
                    <button type="button" class="btn btn-sm btn-primary" id="downloadBtn2">Lataa SVG</button>
                </div>
            </div>
        </div>
    </div>

    <script src="door-spec.js?v=25"></script>
    <script src="door-layout.js?v=25"></script>
    <script src="door-draw.js?v=25"></script>
    <script src="sheet-draw.js?v=25"></script>
    <script src="app.js?v=25"></script>
</body>
</html>
