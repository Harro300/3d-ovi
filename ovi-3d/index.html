<!DOCTYPE html>
<html lang="fi">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Jansen Janisol</title>
    <link rel="stylesheet" href="ovi3d.css?v=38">
</head>
<body>
    <div class="tausta" aria-hidden="true"></div>
    <main>
        <header>
            <span class="kicker">Teräsovi · 3D-esikatselu</span>
            <h1>Jansen Janisol</h1>
            <p>Syötä oviaukko muodossa 15x23 tai mitat millimetreinä. Malli päivittyy heti ja sitä voi pyörittää.</p>
        </header>
        <div class="studio">
            <form id="mitat" autocomplete="off">
                <section class="osio">
                    <h2><span>01</span>Aukko</h2>
                    <label>Oviaukko
                        <input id="oviaukko" type="text" placeholder="15x23" spellcheck="false" autocapitalize="off">
                        <span class="vihje">15x23 on aukko 1500×2300 mm. Oven mitta on 20 mm pienempi molemmissa suunnissa. Kirjain o tai v korkeuden perään valitsee kätisyyden.</span>
                    </label>
                    <div class="tyyppi-kentta">
                        <span class="tyyppi-otsikko">Ovi</span>
                        <div class="tyyppi-valinta" role="radiogroup" aria-label="Ovi">
                            <label class="tyyppi-nappi">
                                <input type="radio" name="tyyppi" value="kayntiovi">
                                <span>Käyntiovi</span>
                            </label>
                            <label class="tyyppi-nappi">
                                <input type="radio" name="tyyppi" value="pariovi" checked>
                                <span>Pariovi</span>
                            </label>
                        </div>
                    </div>
                    <div class="tyyppi-kentta">
                        <span class="tyyppi-otsikko">Kätisyys</span>
                        <div class="tyyppi-valinta" role="radiogroup" aria-label="Kätisyys">
                            <label class="tyyppi-nappi">
                                <input type="radio" name="katisyys" value="oikea" checked>
                                <span>Oikea</span>
                            </label>
                            <label class="tyyppi-nappi">
                                <input type="radio" name="katisyys" value="vasen">
                                <span>Vasen</span>
                            </label>
                        </div>
                    </div>
                </section>
                <section class="osio">
                    <h2><span>02</span>Mitat</h2>
                    <div class="ruudukko">
                        <label id="kayntiLabel">Käyntioven valoaukko<span class="mm"><input id="kaynti" type="number" min="80" step="1" value="795"></span></label>
                        <label id="lisaLabel">Lisäoven valoaukko<span class="mm"><input id="lisa" type="number" min="80" step="1" value="265"></span></label>
                        <label>Oven leveys<span class="mm"><input id="leveys" type="number" min="1000" step="1" value="1480"></span></label>
                        <label>Oven korkeus<span class="mm"><input id="korkeus" type="number" min="800" step="1" value="2310"></span></label>
                        <label>Valoaukon korkeus<span class="mm"><input id="valoH" type="number" min="80" step="1" value="1875"></span></label>
                        <label>Potkupellin korkeus<span class="mm"><input id="potku" type="number" min="40" step="1" value="300"></span></label>
                    </div>
                </section>
                <section class="osio">
                    <h2><span>03</span>Viimeistely</h2>
                    <div class="vari-rivi">
                        <label>Oven väri<input id="vari" type="color" value="#4e5049"></label>
                        <label>RAL<input id="ral" inputmode="numeric" maxlength="4" placeholder="7022" value="7022"></label>
                    </div>
                    <span class="vihje">Jauhemaalaus, matta.</span>
                </section>
                <p id="virhe" hidden></p>
                <button type="button" id="siirra">Siirrä ovipiirtimeen</button>
            </form>
            <div class="kehys" id="kehys">
                <div id="nakyma"></div>
                <div class="tyokalut">
                    <div class="segmentti" role="radiogroup" aria-label="Näkymä">
                        <label><input type="radio" name="nakymatila" value="studio" checked><span>Studio</span></label>
                        <label><input type="radio" name="nakymatila" value="seina"><span>Seinässä</span></label>
                    </div>
                    <div class="segmentti" id="seinaValinta" role="radiogroup" aria-label="Seinä" hidden>
                        <label><input type="radio" name="seina" value="betoni" checked><span>Betoni</span></label>
                        <label><input type="radio" name="seina" value="rappaus"><span>Rappaus</span></label>
                        <label><input type="radio" name="seina" value="tiili"><span>Tiili</span></label>
                    </div>
                    <button type="button" class="ikoni" id="palauta" title="Palauta kuvakulma" aria-label="Palauta kuvakulma">
                        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 12a8 8 0 1 0 2.4-5.7"/><path d="M4 4v4.5h4.5"/></svg>
                    </button>
                    <button type="button" class="ikoni" id="tallenna" title="Tallenna kuva" aria-label="Tallenna kuva">
                        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 4v11"/><path d="M7.5 10.5 12 15l4.5-4.5"/><path d="M5 19h14"/></svg>
                    </button>
                </div>
                <div class="tieto" id="tieto"></div>
                <div class="ohje">Vedä: pyöritä · Rulla: zoomaa · Oikea painike: siirrä</div>
                <div class="lataus"><span class="pyora"></span>Valmistellaan materiaaleja</div>
            </div>
        </div>
    </main>
    <script type="importmap">
    {
        "imports": {
            "three": "https://unpkg.com/three@0.170.0/build/three.module.js",
            "three/addons/": "https://unpkg.com/three@0.170.0/examples/jsm/"
        }
    }
    </script>
    <script type="module" src="ovi3d.js?v=38"></script>
</body>
</html>
